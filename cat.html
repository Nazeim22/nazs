
<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>AR Cat</title>

  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
</head>

<body style="margin: 0; overflow: hidden;">

  <a-scene
    embedded
    arjs="sourceType: webcam; debugUIEnabled: false;"
    vr-mode-ui="enabled: false">

    <a-light type="ambient" intensity="1.5"></a-light>
    <a-light type="directional" position="1 3 2" intensity="1"></a-light>

    <a-marker preset="hiro">

      <!-- CAT GROUP -->
      <a-entity position="0 0 0">

        <!-- Body -->
        <a-sphere
          position="0 0.45 0"
          radius="0.32"
          scale="1 0.85 1.25"
          color="#F5A623">
        </a-sphere>

        <!-- Head -->
        <a-sphere
          position="0 0.95 0.12"
          radius="0.28"
          color="#FFBD59">
        </a-sphere>

        <!-- Left ear -->
        <a-cone
          position="-0.18 1.22 0.12"
          radius-bottom="0.105"
          radius-top="0.005"
          height="0.25"
          color="#FFBD59">
        </a-cone>

        <!-- Right ear -->
        <a-cone
          position="0.18 1.22 0.12"
          radius-bottom="0.105"
          radius-top="0.005"
          height="0.25"
          color="#FFBD59">
        </a-cone>

        <!-- Inner ears -->
        <a-cone
          position="-0.18 1.225 0.19"
          radius-bottom="0.05"
          radius-top="0.002"
          height="0.13"
          color="#FF8FA3">
        </a-cone>

        <a-cone
          position="0.18 1.225 0.19"
          radius-bottom="0.05"
          radius-top="0.002"
          height="0.13"
          color="#FF8FA3">
        </a-cone>

        <!-- Eyes -->
        <a-sphere
          position="-0.105 1.00 0.365"
          radius="0.035"
          color="#202020">
        </a-sphere>

        <a-sphere
          position="0.105 1.00 0.365"
          radius="0.035"
          color="#202020">
        </a-sphere>

        <!-- Nose -->
        <a-sphere
          position="0 0.925 0.39"
          radius="0.03"
          color="#FF6688">
        </a-sphere>

        <!-- Muzzle -->
        <a-sphere
          position="-0.045 0.89 0.37"
          radius="0.045"
          scale="1 0.7 0.7"
          color="#FFF0D9">
        </a-sphere>

        <a-sphere
          position="0.045 0.89 0.37"
          radius="0.045"
          scale="1 0.7 0.7"
          color="#FFF0D9">
        </a-sphere>

        <!-- Legs -->
        <a-cylinder position="-0.20 0.18 0.17"
          radius="0.065" height="0.32" color="#F5A623"></a-cylinder>

        <a-cylinder position="0.20 0.18 0.17"
          radius="0.065" height="0.32" color="#F5A623"></a-cylinder>

        <a-cylinder position="-0.20 0.18 -0.17"
          radius="0.065" height="0.32" color="#F5A623"></a-cylinder>

        <a-cylinder position="0.20 0.18 -0.17"
          radius="0.065" height="0.32" color="#F5A623"></a-cylinder>

        <!-- Tail -->
        <a-torus
          position="0.30 0.48 -0.35"
          radius="0.16"
          radius-tubular="0.035"
          arc="270"
          rotation="90 0 0"
          color="#F5A623">
        </a-torus>

        <!-- Floating / rotating animation -->
        <a-entity
          animation="property: rotation; to: 0 360 0; dur: 6000; loop: true; easing: linear">
        </a-entity>

      </a-entity>

    </a-marker>

    <a-entity camera></a-entity>
  </a-scene>

</body>
</html>
